<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HomeGW 配網</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&family=Noto+Sans+TC:wght@300;400;500&display=swap');
  :root{--bg:#0a0e1a;--surface:#111827;--border:#1e293b;--accent:#22d3ee;--accent2:#818cf8;--success:#34d399;--error:#f87171;--warn:#fbbf24;--text:#e2e8f0;--muted:#64748b;--mono:'JetBrains Mono',monospace;--sans:'Noto Sans TC',sans-serif}
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;overflow-x:hidden}
  body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(34,211,238,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(34,211,238,.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none}
  body::after{content:'';position:fixed;width:600px;height:600px;background:radial-gradient(circle,rgba(34,211,238,.06) 0%,transparent 70%);top:-200px;right:-200px;pointer-events:none}
  .card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:2rem;position:relative;box-shadow:0 0 0 1px rgba(34,211,238,.05),0 20px 60px rgba(0,0,0,.5)}
  .card::before{content:'';position:absolute;top:0;left:10%;right:10%;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.4}
  .header{display:flex;align-items:center;gap:.75rem;margin-bottom:2rem}
  .logo{width:40px;height:40px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex-shrink:0}
  .header-text h1{font-family:var(--mono);font-size:.95rem;font-weight:600;color:var(--accent);letter-spacing:.05em}
  .header-text p{font-size:.75rem;color:var(--muted);margin-top:.1rem}
  .status-bar{display:flex;align-items:center;gap:.5rem;padding:.6rem .9rem;background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:8px;margin-bottom:1.75rem;font-family:var(--mono);font-size:.75rem;min-height:38px}
  .status-dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex-shrink:0;transition:background .3s}
  .status-dot.active{background:var(--accent);box-shadow:0 0 6px var(--accent)}
  .status-dot.success{background:var(--success);box-shadow:0 0 6px var(--success)}
  .status-dot.error{background:var(--error);box-shadow:0 0 6px var(--error)}
  #status-text{color:var(--muted);flex:1}
  .steps{display:flex;gap:.4rem;margin-bottom:1.75rem}
  .step{flex:1;height:3px;background:var(--border);border-radius:2px;transition:background .4s;position:relative;overflow:hidden}
  .step.done{background:var(--success)}
  .step.active::after{content:'';position:absolute;inset:0;background:var(--accent);animation:stepFill 1.2s ease-in-out infinite}
  @keyframes stepFill{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
  .form-group{margin-bottom:1.1rem}
  label{display:block;font-size:.75rem;font-family:var(--mono);color:var(--muted);margin-bottom:.4rem;letter-spacing:.06em;text-transform:uppercase}
  .input-wrap{position:relative}
  input[type=text],input[type=password]{width:100%;padding:.65rem .9rem;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--mono);font-size:.9rem;outline:none;transition:border-color .2s,box-shadow .2s}
  input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(34,211,238,.15)}
  .eye-btn{position:absolute;right:.7rem;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;padding:.2rem;font-size:.9rem}
  .btn{width:100%;padding:.75rem;border:none;border-radius:8px;font-family:var(--mono);font-size:.85rem;font-weight:600;letter-spacing:.04em;cursor:pointer;transition:all .2s}
  .btn:disabled{opacity:.35;cursor:not-allowed}
  .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0a0e1a}
  .btn-primary:not(:disabled):hover{transform:translateY(-1px);box-shadow:0 4px 20px rgba(34,211,238,.3)}
  .btn-secondary{background:transparent;border:1px solid var(--border);color:var(--muted);margin-top:.6rem}
  .btn-secondary:not(:disabled):hover{border-color:var(--accent);color:var(--accent)}
  .btn .spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(10,14,26,.3);border-top-color:#0a0e1a;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:.4rem}
  @keyframes spin{to{transform:rotate(360deg)}}
  .device-info{display:flex;align-items:center;gap:.75rem;padding:.75rem .9rem;background:rgba(34,211,238,.05);border:1px solid rgba(34,211,238,.2);border-radius:8px;margin-bottom:1.25rem}
  .device-name{font-family:var(--mono);font-size:.85rem;color:var(--accent)}
  .device-addr{font-family:var(--mono);font-size:.7rem;color:var(--muted)}
  .success-wrap{text-align:center;padding:1rem 0}
  .success-icon{font-size:3rem;margin-bottom:.75rem;animation:pop .4s cubic-bezier(.34,1.56,.64,1)}
  @keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
  .success-title{font-family:var(--mono);font-size:1rem;color:var(--success);margin-bottom:.4rem}
  .success-sub{font-size:.8rem;color:var(--muted)}
  .log{margin-top:1.25rem;padding:.6rem .8rem;background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:6px;font-family:var(--mono);font-size:.7rem;color:var(--muted);max-height:80px;overflow-y:auto;line-height:1.6}
  .log .ok{color:var(--success)}.log .err{color:var(--error)}.log .info{color:var(--accent)}
  .ios-note{margin-top:1rem;padding:.6rem .8rem;background:rgba(251,191,36,.05);border:1px solid rgba(251,191,36,.2);border-radius:6px;font-size:.72rem;color:var(--warn);line-height:1.5}
  .ios-note a{color:var(--warn)}
  .section{animation:fadeIn .3s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  ::-webkit-scrollbar{width:4px}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="logo">⚡</div>
    <div class="header-text">
      <h1>HomeGW Provisioning</h1>
      <p>BLE WiFi 配網工具</p>
    </div>
  </div>
  <div class="steps">
    <div class="step" id="step1"></div>
    <div class="step" id="step2"></div>
    <div class="step" id="step3"></div>
    <div class="step" id="step4"></div>
  </div>
  <div class="status-bar">
    <div class="status-dot" id="dot"></div>
    <span id="status-text">載入加密模組中...</span>
  </div>
  <div id="sec-scan" class="section" style="display:none">
    <button class="btn btn-primary" id="btn-scan" onclick="startScan()">🔍 &nbsp;掃描 BLE 裝置</button>
    <div class="ios-note">📱 iOS 用戶請使用
      <a href="https://apps.apple.com/app/bluefy/id1492822055" target="_blank">Bluefy</a>
      瀏覽器開啟此頁面
    </div>
  </div>
  <div id="sec-device" class="section" style="display:none">
    <div class="device-info">
      <div style="font-size:1.4rem">📡</div>
      <div>
        <div class="device-name" id="dev-name">-</div>
        <div class="device-addr" id="dev-addr">-</div>
      </div>
    </div>
    <button class="btn btn-primary" id="btn-connect" onclick="connectDevice()">🔗 &nbsp;連線並開始配網</button>
    <button class="btn btn-secondary" onclick="resetToScan()">重新掃描</button>
  </div>
  <div id="sec-wifi" class="section" style="display:none">
    <div class="form-group">
      <label>WiFi 名稱 (SSID)</label>
      <input type="text" id="inp-ssid" placeholder="輸入 WiFi 名稱" autocomplete="off" spellcheck="false">
    </div>
    <div class="form-group">
      <label>WiFi 密碼</label>
      <div class="input-wrap">
        <input type="password" id="inp-pwd" placeholder="輸入 WiFi 密碼">
        <button class="eye-btn" onclick="togglePwd()">👁</button>
      </div>
    </div>
    <button class="btn btn-primary" id="btn-send" onclick="sendWifi()">✈️ &nbsp;送出配網</button>
    <button class="btn btn-secondary" onclick="disconnect()">取消連線</button>
  </div>
  <div id="sec-success" class="section" style="display:none">
    <div class="success-wrap">
      <div class="success-icon">✅</div>
      <div class="success-title">配網完成！</div>
      <div class="success-sub" id="success-msg">裝置正在連接 WiFi...</div>
    </div>
    <button class="btn btn-secondary" style="margin-top:1.5rem" onclick="resetToScan()">重新配網</button>
  </div>
  <div class="log" id="log"></div>
</div>

<script type="module">
// Load noble/curves x25519 from CDN
import { x25519 } from 'https://cdn.jsdelivr.net/npm/@noble/curves@1.4.0/+esm'

// ── BLE constants ──────────────────────────────────────────────
const SVC_UUID    = '49535343-fe7d-4ae5-8fa9-9fafd205e455'
const WRITE_UUID  = '49535343-1e4d-4bd9-ba61-23c647249616'
const NOTIFY_UUID = '49535343-8841-43f4-a8d4-ecbe34729bb3'
const OPC_HOST_PUB = 0x63
const OPC_DEV_PUB  = 0x64
const OPC_SSID     = 0x04
const OPC_PWD      = 0x05
const OPC_CONNECT  = 0x06

let bleDevice = null, writeChr = null, notifyChr = null
let aesKey = null, notifyResolve = null

// ── UI helpers ─────────────────────────────────────────────────
function setStatus(msg, type='idle') {
  document.getElementById('status-text').textContent = msg
  const dot = document.getElementById('dot')
  dot.className = 'status-dot' + (type !== 'idle' ? ' ' + type : '')
}
function addLog(msg, cls='') {
  const log = document.getElementById('log')
  const line = document.createElement('div')
  if (cls) line.className = cls
  line.textContent = '› ' + msg
  log.appendChild(line)
  log.scrollTop = log.scrollHeight
}
function showSection(id) {
  ['sec-scan','sec-device','sec-wifi','sec-success'].forEach(s =>
    document.getElementById(s).style.display = s === id ? '' : 'none')
}
function setStep(n) {
  for (let i = 1; i <= 4; i++) {
    const el = document.getElementById('step' + i)
    el.className = 'step' + (i < n ? ' done' : i === n ? ' active' : '')
  }
}
function setBtnLoading(id, loading, label) {
  const btn = document.getElementById(id)
  btn.disabled = loading
  btn.innerHTML = loading ? '<span class="spin"></span> 處理中...' : label
}
function resetToScan() {
  if (bleDevice && bleDevice.gatt.connected) bleDevice.gatt.disconnect()
  bleDevice = writeChr = notifyChr = aesKey = null
  showSection('sec-scan')
  setStep(1)
  setStatus('等待開始...')
  document.getElementById('log').innerHTML = ''
}
window.resetToScan = resetToScan
window.togglePwd = () => {
  const inp = document.getElementById('inp-pwd')
  inp.type = inp.type === 'password' ? 'text' : 'password'
}
window.disconnect = () => {
  if (bleDevice && bleDevice.gatt.connected) bleDevice.gatt.disconnect()
  resetToScan()
}

// ── AES-128 CTR ────────────────────────────────────────────────
async function importAesKey(keyBytes) {
  return crypto.subtle.importKey('raw', keyBytes.slice(0,16), {name:'AES-CTR'}, false, ['encrypt'])
}
async function aesEncrypt(key, data) {
  const iv = new Uint8Array(16)
  const ct = await crypto.subtle.encrypt({name:'AES-CTR', counter:iv, length:64}, key, data)
  return new Uint8Array(ct)
}

// ── Notify helper ──────────────────────────────────────────────
function waitForNotify(ms=8000) {
  return new Promise((resolve, reject) => {
    notifyResolve = resolve
    setTimeout(() => { notifyResolve = null; reject(new Error('Notify timeout')) }, ms)
  })
}
function onNotify(e) {
  const data = new Uint8Array(e.target.value.buffer)
  if (notifyResolve) { notifyResolve(data); notifyResolve = null }
}

// ── BLE flow ───────────────────────────────────────────────────
window.startScan = async function() {
  if (!navigator.bluetooth) {
    setStatus('瀏覽器不支援 Web Bluetooth', 'error')
    addLog('請使用 Chrome，iOS 請用 Bluefy', 'err')
    return
  }
  try {
    setStep(1)
    setStatus('掃描中...', 'active')
    setBtnLoading('btn-scan', true)
    addLog('開啟 BLE 掃描...')
    bleDevice = await navigator.bluetooth.requestDevice({
      filters: [{namePrefix: 'homegw'}],
      optionalServices: [SVC_UUID]
    })
    addLog('找到: ' + bleDevice.name, 'ok')
    document.getElementById('dev-name').textContent = bleDevice.name
    document.getElementById('dev-addr').textContent = bleDevice.id || '—'
    bleDevice.addEventListener('gattserverdisconnected', () => {
      addLog('BLE 連線中斷', 'err')
      setStatus('已斷線', 'error')
    })
    showSection('sec-device')
    setStatus('找到裝置，準備連線')
  } catch(e) {
    setStatus('掃描取消', 'error')
    addLog(e.message, 'err')
  } finally {
    setBtnLoading('btn-scan', false, '🔍 &nbsp;掃描 BLE 裝置')
  }
}

window.connectDevice = async function() {
  try {
    setStep(2)
    setStatus('連線中...', 'active')
    setBtnLoading('btn-connect', true)
    addLog('連接 GATT...')
    const server = await bleDevice.gatt.connect()
    const svc = await server.getPrimaryService(SVC_UUID)
    writeChr  = await svc.getCharacteristic(WRITE_UUID)
    notifyChr = await svc.getCharacteristic(NOTIFY_UUID)
    await notifyChr.startNotifications()
    notifyChr.addEventListener('characteristicvaluechanged', onNotify)
    addLog('已連接，啟用 Notify ✓', 'ok')

    setStep(3)
    setStatus('金鑰交換中...', 'active')

    const priv = x25519.utils.randomPrivateKey()
    const pub  = x25519.getPublicKey(priv)
    addLog('Host 公鑰: ' + Array.from(pub).slice(0,4).map(b=>b.toString(16).padStart(2,'0')).join('')+'...', 'info')

    const msg = new Uint8Array(33)
    msg[0] = OPC_HOST_PUB
    msg.set(pub, 1)
    await writeChr.writeValueWithoutResponse(msg)
    addLog('等待裝置公鑰...')

    const reply = await waitForNotify(8000)
    if (reply[0] !== OPC_DEV_PUB) throw new Error('Unexpected opcode: 0x' + reply[0].toString(16))
    const devPub = reply.slice(1, 33)
    addLog('裝置公鑰: ' + Array.from(devPub).slice(0,4).map(b=>b.toString(16).padStart(2,'0')).join('')+'... ✓', 'ok')

    const shared = x25519.getSharedSecret(priv, devPub)
    aesKey = await importAesKey(shared)
    addLog('AES 金鑰建立 ✓', 'ok')

    showSection('sec-wifi')
    setStep(4)
    setStatus('請輸入 WiFi 設定', 'active')
  } catch(e) {
    setStatus('連線失敗', 'error')
    addLog(e.message, 'err')
    setBtnLoading('btn-connect', false, '🔗 &nbsp;連線並開始配網')
  }
}

window.sendWifi = async function() {
  const ssid = document.getElementById('inp-ssid').value.trim()
  const pwd  = document.getElementById('inp-pwd').value
  if (!ssid) { addLog('請輸入 SSID', 'err'); return }
  if (!pwd)  { addLog('請輸入密碼', 'err'); return }
  try {
    setBtnLoading('btn-send', true)
    setStatus('傳送配網資料...', 'active')
    const enc = new TextEncoder()
    function padTo16(b) {
      const p = new Uint8Array(Math.ceil(b.length/16)*16); p.set(b); return p
    }
    const ssidCt = await aesEncrypt(aesKey, padTo16(enc.encode(ssid)))
    const ssidPkt = new Uint8Array(1+ssidCt.length)
    ssidPkt[0] = OPC_SSID; ssidPkt.set(ssidCt,1)
    await writeChr.writeValueWithoutResponse(ssidPkt)
    addLog('SSID 已送出', 'info')
    await new Promise(r => setTimeout(r, 150))

    const pwdCt = await aesEncrypt(aesKey, padTo16(enc.encode(pwd)))
    const pwdPkt = new Uint8Array(1+pwdCt.length)
    pwdPkt[0] = OPC_PWD; pwdPkt.set(pwdCt,1)
    await writeChr.writeValueWithoutResponse(pwdPkt)
    addLog('密碼已送出', 'info')
    await new Promise(r => setTimeout(r, 150))

    await writeChr.writeValueWithoutResponse(new Uint8Array([OPC_CONNECT]))
    addLog('CONNECT 已送出 ✓', 'ok')

    document.getElementById('success-msg').textContent = '正在連接 ' + ssid + '，請稍候...'
    showSection('sec-success')
    setStatus('配網完成！', 'success')
    setTimeout(() => {
      if (bleDevice && bleDevice.gatt.connected) bleDevice.gatt.disconnect()
    }, 1500)
  } catch(e) {
    setStatus('傳送失敗', 'error')
    addLog(e.message, 'err')
    setBtnLoading('btn-send', false, '✈️ &nbsp;送出配網')
  }
}

// ── Init ───────────────────────────────────────────────────────
setStep(1)
addLog('X25519 加密模組已就緒 (noble/curves) ✓', 'ok')
setStatus('等待開始...')
showSection('sec-scan')
</script>
</body>
</html>
